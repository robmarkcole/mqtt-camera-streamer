[project]
name = "mqtt-camera-streamer"
version = "0.1.0"
description = "RF-DETR ONNX webcam predictions and Home Assistant MQTT discovery"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fast-alpr[onnx]==0.4.0",
    "numpy>=2,<3",
    "paho-mqtt>=2.1,<3",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "rfdetr[onnx,stream]==1.12.1",
    "supervision==0.32.0",
    "trackers==2.7.0",
]

[dependency-groups]
dev = ["amqtt>=0.12,<0.13", "pytest>=8,<10", "ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
